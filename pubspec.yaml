name: strascrous
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
    sdk: ^3.13.0

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    dynamic_color: ^1.9.0
    get: ^4.7.3
    go_router: ^18.0.2
    flutter_svg: ^2.3.0
    collection: ^1.19.1
    get_storage: ^2.1.1
    provider: ^6.1.5+1
    intl: ^0.20.3
    geolocator: ^14.1.2
    http: ^1.6.0
    url_launcher: ^6.3.3

    strascrous_data:
        git:
            url: https://github.com/Strascrous/Data.git
            ref: generated/dart

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
    android: "ic_launcher"
    ios: false # TODO: Adapter à iOS quand je passerais à iOS
    image_path: "assets/app_icon/icon.png"
    min_sdk_android: 21

    adaptive_icon_background: "#b92e3a"
    adaptive_icon_foreground: "assets/app_icon/foreground.png"
    adaptive_icon_foreground_inset: 10
    adaptive_icon_monochrome: "assets/app_icon/foreground.png"

flutter:
    uses-material-design: true
    assets:
      - assets/icons/payments/
      - assets/icons/credits/
